<!DOCTYPE html>
<html lang="es/US">
    <head>
        <title>Derecho Público</title>
        <meta charset="UTF-8">
        <meta name="theme-color" content="#e9e7e5">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="../imgs/placehold.svg" type="image/svg">
        <link rel="stylesheet" href="css/reporte.css">
    </head>
    <body>
        <main id="app">
            <section class="menu-reporte" id="menu">
                <header class="barra-sup-reporte">
                    <button id="boton-reporte-atras">
                        <!-- icono retornar aca -->
                    </button>
                    <div>
                        <h1 id="titulo-reporte">Denuncia / Aviso</h1>
                        <p id="sub-reporte">¡Ayúdanos a mejorar tu calidad de vida!</p>
                    </div>
                </header>
                <form id="reporte-formulario">
                    <label class="titulo-secc" for="tipo-rep">Tipo de reporte</label>
                    <select id="tipo-rep" required>
                        <option value="denuncia">Denuncia; Falta acceso universal</option>
                        <option value="informar">Informar; Existe acceso universal</option>
                        <option value="aviso-temp">Aviso temporal</option>
                    </select>
                    <label class="titulo-secc" for="niv-acceso">Nivel de accesibilidad</label>
                    <select id="niv-acceso" required>
                        <option value="bueno">Accesible</option>
                        <option value="medio">Mejorable</option>
                        <option value="bajo">Deficiente</option>
                        <option value="nulo">Inaccesible</option>
                    </select>
                    <label class="titulo-secc" for="comentarios">Comentario sobre la ubicación</label>
                    <textarea id="comentarios" rows="3" placeholder="Describa el problema (opcional)"></textarea>
                    <label class="titulo-secc" for="ubicacion">Ubicación GPS o dirección</label>
                    <div class="secc-ubicacion">
                        <input id="ubicacion" type="text" placeholder="Dirección o coordenadas" required>
                        <button type="button" id="gps-boton" class="sec">GPS</button>
                    </div>
                    <p id="estado-gps" class="aviso-ayuda">
                        Puedes escribir una dirección o usar tu ubicación actual.
                    </p>
                    <label class="titulo-secc" for="evidencia">Adjuntar imágenes</label>
                    <label class="subir-evid" for="evidencia">
                        <span class="camara">
                            <!-- icono de camara aca -->
                        </span>
                        <strong>Seleccionar imágenes</strong>
                        <span class="aviso-ayuda">Puedes adjuntar más de una</span>
                    </label>
                    <input id="imagenes" type="file" accept="image/*" multiple class="input-evid">
                    <div id="preview-evid"></div>
                    <div class="acciones-formulario">
                        <button type="button" class="sec" id="cancelar-repor">Cancelar</button>
                        <button type="submit" class="pri">Confirmar</button>
                    </div>
                </form>
            </section>
            <div id="toast" class="toast oculto" role="status"></div>
        </main>
        <script src="js/reporte.js"></script>
    </body>
</html>
