<!DOCTYPE html>
<html lang="es/US">
    <head>
        <title>Derecho Publico</title>
        <link rel="icon" href="imgs/logo.png" type="image/png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: monospace;
                font-size: large;
                width: 100%;
                height: 100%;
                margin: 0;
                background-color: black;
            }
            #page {
                display: grid;
                grid-template-rows: auto minmax(0, 1fr) auto;
                width: 100%;
                height: 100vh;
                height: 100dvh;
            }
            #top-bar {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 60px;
                gap: 15px;
                position: relative;
                background-color: rgba(117, 117, 117, 0.50);
            }
            #bottom-bar {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 60px;
                padding: 12px;
            }
            #map {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
            }
            button {
                font-family: monospace;
                font-size: larger;
                width: 400px;
                height: 60px;
            }
        </style>
    </head>
    <body>
        <div id="page">
            <header id="top-bar">
                <img width="50px" src="imgs/logo.png" type="image/png">
                <h1>Derecho Publico</h1>
            </header>
            <main id="map">
                <p>mapa va aca</p>
            </main>
            <footer id="bottom-bar">
                <button id="report">Reportar</button>
                <button id="inform">Informar</button>
            </footer>
        </div>
    </body>
</html>
